<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<style>
/* VOICE спокойный бытовой помощник · IDEA список покупок на холодильнике · PICTURE меню дня крупно
   COLOUR тема Telegram, иначе белый + зелёный · TYPE системный · LAYOUT одна колонка, нижняя навигация */
:root{--bg:#f4f5f2;--card:#fff;--ink:#1b1f1a;--mut:#6b7268;--line:#e4e7e1;--acc:#2f7d4f;--acc-ink:#fff;--acc2:#e6f2ea;--warn:#b5651d}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c201c;--ink:#e9ece7;--mut:#9aa196;--line:#2c312b;--acc:#5fbf86;--acc-ink:#0d1a12;--acc2:#1f3327;--warn:#e0a060}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 150px}
h1{font-size:24px;line-height:1.15;margin:6px 0 4px}h2{font-size:19px;margin:0 0 10px}h3{margin:0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:inherit;cursor:pointer;min-height:48px}
.opt.on{border-color:var(--acc);background:var(--acc2)}.opt small{display:block;color:var(--mut)}
input.num,input.search{width:100%;padding:13px 14px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}.btn.full{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.fav{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:600}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.step.ok .n{background:var(--acc);color:var(--acc-ink)}.step.ok .tx{opacity:.45}
.timer{margin-top:8px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--acc);background:none;color:var(--acc);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.timer.run{background:var(--acc);color:var(--acc-ink)}.timer.end{border-color:var(--warn);background:var(--warn);color:#fff}
.chip.ban{border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.daybar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory}
.daybar button{flex:none;scroll-snap-align:start;width:52px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.daybar button b{display:block;font-size:16px}.daybar button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.meal{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.meal:first-of-type{border-top:0}.meal b{font-weight:600}.meal .k{white-space:nowrap;text-align:right;font-size:13px;color:var(--mut)}
.tag{font-size:12px;color:var(--acc);font-weight:600}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0}.li>span:last-child{white-space:nowrap;text-align:right}
.li.done>span:first-child{opacity:.4;text-decoration:line-through}
.box{display:inline-block;width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;vertical-align:-4px;margin-right:8px;text-align:center;line-height:17px;font-size:13px}
.done .box{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.grp{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--mut)}
.tot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:15px}
.tot .best{color:var(--acc);font-weight:700}
.est{color:var(--warn);font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.kpi div{background:var(--acc2);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:clamp(15px,4.6vw,19px);white-space:nowrap}.kpi span{font-size:12px;color:var(--mut)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,64px);gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.prow>span:not(:first-child){text-align:right;white-space:nowrap}.prow.h{font-size:12px;color:var(--mut);border-top:0}
.prow .b{color:var(--acc);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px 0;cursor:pointer;min-height:48px}
.nav button svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc);font-weight:600}
.act{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 14px;pointer-events:none;z-index:9}
.act .in{max-width:532px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}.act .btn{flex:1}
.quiz .act{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet .row{display:flex;gap:8px;margin-top:12px}.sheet .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:20px;margin:6px 0 12px}
.hero h1{margin:0 0 6px}.hero p{margin:0 0 14px;opacity:.9}.hero .btn{background:var(--acc-ink);color:var(--acc)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>

ой 5 минут.","t":5},{"s":"Подогрей молоко (не кипяти) и залей гречку в тарелке."}]},{"id":"b7","name":"Бутерброды с сыром и варёным яйцом","cat":"breakfast","time":12,"ing":{"bread":70,"cheese":30,"eggs":1,"tomato":80,"butter":5},"how":"Сварить яйцо 9 мин. Хлеб с маслом, сыром, помидором и яйцом.","need":["pot_any"],"steps":[{"s":"Положи яйцо в кастрюлю, залей холодной водой, доведи до кипения."},{"s":"После закипания вари на среднем огне.","t":9},{"s":"Переложи яйцо в холодную воду на 3 минуты — так оно легко почистится.","t":3},{"s":"Хлеб намажь маслом, сверху сыр, кружки помидора и яйца. Посоли и поперчи."}]},{"id":"b8","name":"Рисовая каша на молоке","cat":"breakfast","time":25,"ing":{"rice":60,"milk":250,"butter":5,"honey":10},"how":"Рис отварить в воде 7 мин, слить, добавить молоко и варить ещё 12–15 мин. Масло и мёд по вкусу.","need":["pot_any|multi"],"steps":[{"s":"Промой рис до прозрачной воды."},{"s":"Залей рис водой (в 2 раза больше по объёму), доведи до кипения и вари на среднем огне.","t":7},{"s":"Слей лишнюю воду, влей молоко, добавь щепотку соли."},{"s":"Вари на слабом огне, помешивая каждые 2–3 минуты, чтобы не пригорело.","t":15},{"s":"Добавь масло, накрой крышкой и дай постоять.","t":5},{"s":"В тарелке полей мёдом."}]},{"id":"b9","name":"Шакшука","cat":"breakfast","time":20,"ing":{"eggs":2,"tomato":200,"bell_pepper":80,"onion":40,"oil":7,"bread":50},"how":"Обжарить лук и перец, добавить нарезанные помидоры, тушить 7 мин. Сделать лунки, вбить яйца, накрыть на 5 мин. Подавать с хлебом.","need":["pan"],"steps":[{"s":"Нарежь лук полукольцами, перец — соломкой, помидоры — кубиками."},{"s":"Разогрей масло на сковороде на среднем огне, обжарь лук до мягкости.","t":3},{"s":"Добавь перец, жарь ещё немного.","t":3},{"s":"Добавь помидоры, соль, перец, при желании зиру или паприку. Туши, пока соус не загустеет.","t":7},{"s":"Сделай ложкой 2 углубления, разбей в них яйца, посоли желтки."},{"s":"Убавь огонь до слабого, накрой крышкой и готовь, пока белок не схва Убавь огонь до слабого, посоли и вари мясо.","t":50},{"s":"Пока варится: свёклу и морковь натри на крупной тёрке, лук нарежь мелко, капусту нашинкуй тонко, картофель нарежь кубиками."},{"s":"На сковороде с маслом обжарь лук и морковь на среднем огне.","t":4},{"s":"Добавь свёклу, томатную пасту и 2–3 ложки бульона. Туши под крышкой. Для яркого цвета можно добавить каплю уксуса или лимонного сока.","t":10},{"s":"Достань мясо, нарежь кусочками. В бульон положи картофель и капусту.","t":10},{"s":"Добавь зажарку и мясо, вари на слабом огне. Посоли, поперчи, можно лавровый лист.","t":10},{"s":"Выключи огонь и дай борщу настояться под крышкой. Подавай со сметаной.","t":15}]},{"id":"s3","name":"Суп с куриными фрикадельками","cat":"soup","time":40,"ing":{"chicken_mince":120,"potato":120,"carrot":40,"onion":30,"rice":15,"greens":5},"how":"Скатать фрикадельки из фарша. В кипящую воду картофель, морковь, лук и рис на 10 мин, затем фрикадельки на 10 мин. Зелень в конце.","need":["bigpot"],"steps":[{"s":"Мелко нарежь или натри треть лука и смешай с фаршем, посоли и поперчи."},{"s":"Мокрыми руками скатай фрикадельки размером с грецкий орех."},{"s":"Вскипяти воду (около 500 мл на порцию), посоли. Положи картофель кубиками, морковь, оставшийся лук и промытый рис.","t":10},{"s":"По одной опусти фрикадельки в кипящий суп, они всплывут через 2–3 минуты. Вари.","t":10},{"s":"Добавь зелень, попробуй на соль и выключи огонь."}]},{"id":"s4","name":"Чечевичный суп","cat":"soup","time":35,"ing":{"lentils":70,"potato":80,"carrot":40,"onion":40,"tomato_paste":10,"oil":7},"how":"Обжарить лук и морковь с пастой. Чечевицу и картофель варить 20 мин, добавить зажарку, при желании пробить блендером.","need":["bigpot","pan"],"steps":[{"s":"Промой чечевицу. Картофель нарежь кубиками, лук — мелко, морковь натри."},{"s":"Вскипяти воду (около 450 мл на порцию), положи чечевицу и картофель, вари на среднем огне.","t":15},{"s":"На сковороде с маслом обжарь лук и морковь, добавь томатную пасту и зиру (по желанию).","t":5},{"s":"Добавь зажарку в суп, посоли, вари ещё немного, пока чечевица не разварится.","t":7},{"s":"По желанию пробей блендером до крем-супа. Подавай с долькой лимона и хлебом."}]},{"id":"s5","name":"Щи из свежей капусты","cat":"soup","time":55,"ing":{"beef":90,"cabbage":150,"potato":100,"carrot":30,"onion":30,"tomato_paste":10,"sour_cream":20},"how":"Варить говядину 35 мин, добавить капусту и картофель на 15 мин, затем зажарку из лука, моркови и пасты на 5 мин.","need":["bigpot","pan"],"steps":[{"s":"Залей говядину холодной водой (около 600 мл на порцию), доведи до кипения, сними пену."},{"s":"Посоли, убавь огонь и вари.","t":35},{"s":"Нашинкуй капусту, картофель нарежь кубиками, лук мелко, морковь натри."},{"s":"Достань мясо и нарежь. В бульон положи капусту и картофель.","t":15},{"s":"На сковороде обжарь лук и морковь, добавь томатную пасту, прогрей 2 минуты.","t":5},{"s":"Добавь зажарку и мясо в суп, вари. Посоли, поперчи, положи лавровый лист.","t":5},{"s":"Дай настояться под крышкой. Подавай со сметаной и зеленью.","t":10}]},{"id":"s6","name":"Сорпа (шорпа) с говядиной","cat":"soup","time":90,"ing":{"beef":130,"potato":150,"carrot":50,"onion":50,"bell_pepper":50,"greens":5},"how":"Говядину крупными кусками варить 60 мин на слабом огне, снимая пену. Добавить крупно нарезанные овощи на 20 мин. Зелень при подаче.","need":["bigpot"],"steps":[{"s":"Нарежь говядину крупными кусками по 4–5 см, залей холодной водой (около 700 мл на порцию)."},{"s":"Доведи до кипения на сильном огне и тщательно сними всю пену — от этого зависит прозрачность бульона."},{"s":"Убавь огонь до минимального, чтобы бульон еле булькал, посоли и вари.","t":60},{"s":"Нарежь крупно: картофель — половинками, морковь — крупными брусками, лук — целиком или четвертинками, перец — на 4 части."},{"s":"Положи овощи в бульон, вари на слабом огне, пока картофель не станет мягким.","t":20},{"s":"Добавь чёрный перец, зелень, выключи огонь и дай постоять 10 минут. Подавай мясо и овощи в тарелке, бульон — отдельно в пиале.","t":10}]},{"id":"m1","name":"Гречка с куриным филе и овощами","cat":"main","time":30,"ing":{"buckwheat":70,"chicken_breast":150,"carrot":50,"onion":40,"oil":7},"how":"Сварить гречку. Филе кубиками обжарить с луком и морковью 10 мин, смешать с гречкой.","need":["pot_any|multi","pan"],"steps":[{"s":"Промой гречку, залей водой 1:2, посоли и поставь вариться: после закипания — минимальный огонь под крышкой.","t":15},{"s":"Пока варится, нарежь куриное филе кубиками 2 см, лук — полукольцами, морковь — соломкой."},{"s":"Разогрей масло на сковороде на среднем-сильном огне, обжарь курицу до белого цвета со всех сторон.","t":5},{"s":"Добавь лук и морковь, посоли, поперчи, жарь, помешивая, пока овощи не станут мягкими.","t":6},{"s":"Добавь готовую гречку в сковороду, перемешай и прогрей вместе.","t":2}]},{"id":"m2","name":"Курица с рисом и овощами","cat":"main","time":35,"ing":{"rice":70,"chicken_breast":150,"bell_pepper":80,"zucchini":100,"oil":7},"how":"Сварить рис. Курицу и овощи обжарить, потушить 10 мин под крышкой.","need":["pot_any|multi","pan"],"steps":[{"s":"Промой рис, залей водой 1:2, посоли, после закипания вари на минимальном огне под крышкой.","t":15},{"s":"Нарежь курицу кубиками, кабачок — полукружьями, перец — соломкой."},{"s":"Обжарь курицу на масле на среднем-сильном огне до румяности.","t":5},{"s":"Добавь овощи, соль, перец, можно соевый соус. Влей 50 мл воды, накрой крышкой и туши.","t":10},{"s":"Выложи рис на тарелку, сверху — курицу с овощами."}]},{"id":"m3","name":"Плов с говядиной (лёгкий)","cat":"main","time":80,"ing":{"rice":80,"beef":120,"carrot":120,"onion":50,"garlic":5,"oil":15},"how":"В казане обжарить мясо, лук и морковь соломкой, залить водой и тушить 30 мин (зирвак). Всыпать промытый рис, воды на 1,5 см выше, сверху головка чеснока. Варить до впитывания, затем 20 мин под крышкой на минимуме.","need":["kazan|multi|pot_big"],"steps":[{"s":"Промой рис 5–6 раз до прозрачной воды и замочи в тёплой подсоленной воде на 30 минут.","t":30},{"s":"Нарежь мясо кубиками 2–3 см, лук — полукольцами, морковь — длинной соломкой (не на тёрке!)."},{"s":"Сильно разогрей масло в казане. Обжарь мясо до корочки, не мешая первые 2 минуты.","t":7},{"s":"Добавь лук, жарь до золотистого цвета.","t":4},{"s":"Добавь морковь, не мешай 2 минуты, затем перемешай и жарь до мягкости. Посоли, добавь зиру и барбарис (по желанию).","t":5},{"s":"Влей кипяток так, чтобы покрыть содержимое, убавь огонь и туши — это зирвак.","t":30},{"s":"Слей воду с риса, выложи его ровным слоем поверх зирвака, не перемешивая. Аккуратно влей кипяток, чтобы он покрыл рис на 1,5 см. Вдави в центр головку чеснока."},{"s":"На сильном огне выпари воду с поверхности риса. Потом собери рис горкой, сделай палочкой несколько проколов до дна."},{"s":"Накрой плотной крышкой, убавь огонь до минимума и томи.","t":20},{"s":"Перемешай плов снизу вверх и подавай."}]},{"id":"m4","name":"Лагман домашний","cat":"main","time":50,"ing":{"pasta":80,"beef":110,"bell_pepper":70,"tomato":100,"onion":40,"carrot":40,"cabbage":50,"garlic":5,"oil":10},"how":"Мясо соломкой обжарить, добавить овощи, тушить с водой 20 мин (ваджу). Отварить спагетти, полить соусом.","need":["pot_any","pan|kazan"],"steps":[{"s":"Нарежь мясо тонкой соломкой, перец, морковь и капусту — соломкой, лук — полукольцами, помидоры — кубиками, чеснок — мелко."},{"s":"В сковороде или казане сильно разогрей масло, обжарь мясо до румяности.","t":5},{"s":"Добавь лук и морковь, жарь.","t":3},{"s":"Добавь перец, капусту, чеснок, затем помидоры. Посоли, добавь зиру и молотый перец.","t":3},{"s":"Влей воду (около 150 мл на порцию), накрой крышкой и туши на среднем огне — это ваджу (подлива).","t":20},{"s":"Тем временем отвари спагетти в подсоленной воде по инструкции на пачке, откинь и сбрызни маслом.","t":9},{"s":"Разложи лапшу по глубоким тарелкам и щедро полей ваджу."}]},{"id":"m5","name":"Тефтели в томатном соусе с пюре","cat":"main","time":50,"ing":{"beef_mince":150,"rice":20,"onion":30,"tomato_paste":20,"potato":200,"milk":50,"butter":5},"how":"Фарш смешать с отварным рисом и луком, скатать тефтели, тушить 25 мин в соусе из пасты и воды. Картофель отварить и размять с молоком и маслом.","need":["pot_any","pan|kazan|multi"],"steps":[{"s":"Отвари рис для тефтелей до полуготовности, остуди.","t":8},{"s":"Мелко нарежь половину лука, смешай с фаршем и рисом, посоли, поперчи и хорошо вымеси."},{"s":"Скатай тефтели размером с мандарин."},{"s":"Обжарь тефтели на сковороде со всех сторон до корочки.","t":5},{"s":"Добавь оставшийся лук, томатную пасту и воду (около 150 мл на порцию), посоли. Накрой крышкой и туши на слабом огне.","t":25},{"s":"Параллельно очисти картофель, нарежь крупно, отвари в подсоленной воде до мягкости.","t":20},{"s":"Слей воду, добавь масло и горячее молоко, разомни толкушкой до гладкого пюре."},{"s":"Подавай пюре с тефтелями и соусом."}]},{"id":"m6","name":"Минтай, запечённый с картофелем","cat":"main","time":45,"ing":{"fish_pollock":200,"potato":200,"onion":30,"sour_cream":30,"oil":5},"how":"Картофель тонкими кружками в форму, сверху рыбу и лук, смазать сметаной. Запекать 35 мин при 190°.","need":["oven"],"steps":[{"s":"Разогрей духовку до 190°."},{"s":"Если минтай замороженный — разморозь в холодильнике или холодной воде. Обсуши, удали плавники, нарежь порционно."},{"s":"Картофель очисти и нарежь тонкими кружками 3–4 мм, лук — полукольцами."},{"s":"Смажь форму маслом, выложи картофель, посоли и поперчи."},{"s":"Сверху выложи рыбу, посоли, затем лук. Смажь всё сметаной."},{"s":"Накрой фольгой и запекай.","t":25},{"s":"Сними фольгу и запекай до румяной корочки.","t":10}]},{"id":"m7","name":"Паста с курицей и шампиньонами","cat":"main","time":30,"ing":{"pasta":80,"chicken_breast":120,"mushrooms":100,"sour_cream":40,"cheese":15,"oil":5},"how":"Обжарить курицу и грибы, добавить сметану и немного воды, потушить 5 мин. Смешать с отварной пастой, посыпать сыром.","need":["pot_any","pan"],"steps":[{"s":"Поставь кастрюлю с водой на огонь, посоли (10 г соли на литр)."},{"s":"Нарежь курицу кубиками, шампиньоны — пластинками, сыр натри."},{"s":"Обжарь курицу на масле на среднем-сильном огне.","t":5},{"s":"Добавь грибы, жарь, пока не уйдёт жидкость и они не подрумянятся.","t":6},{"s":"Отвари пасту на 1 минуту меньше времени на пачке. Сохрани полстакана воды от варки.","t":9},{"s":"В сковороду добавь сметану и 3–4 ложки воды от пасты, посоли, поперчи, прогрей.","t":2},{"s":"Переложи пасту в соус, перемешай на огне 1 минуту, посыпь сыром."}]},{"id":"m8","name":"Куырдак из говядины с картофелем","cat":"main","time":50,"ing":{"beef":140,"potato":200,"onion":50,"oil":10},"how":"Мясо кусочками обжарить до корочки, добавить лук, затем картофель кубиками и немного воды. Тушить 25 мин.","need":["pan|kazan|multi"],"steps":[{"s":"Нарежь мясо кусочками 2–3 см, картофель — кубиками, лук — полукольцами."},{"s":"Сильно разогрей масло в сковороде или казане. Обжарь мясо до тёмной корочки, не мешая первые 2 минуты.","t":7},{"s":"Добавь лук, посоли, поперчи, добавь зиру, жарь.","t":4},{"s":"Влей немного воды (около 100 мл на порцию), накрой крышкой и туши.","t":15},{"s":"Добавь картофель, перемешай, долей воды до половины, накрой и туши до мягкости картофеля.","t":20},{"s":"Сними крышку и выпари лишнюю жидкость на сильном огне.","t":3}]},{"id":"m9","name":"Жаркое из курицы с картошкой","cat":"main","time":50,"ing":{"chicken_thigh":200,"potato":200,"carrot":50,"onion":40,"oil":5},"how":"Бёдра обжарить, добавить овощи и воду до половины. Тушить 30 мин под крышкой.","need":["kazan|pan|multi"],"steps":[{"s":"Посоли и поперчи бёдра. Картофель нарежь крупно, морковь — кружками, лук — полукольцами."},{"s":"Обжарь бёдра на масле кожей вниз до золотистой корочки.","t":5},{"s":"Переверни, добавь лук и морковь, жарь.","t":3},{"s":"Добавь картофель, посоли, влей воду до половины высоты продуктов. Можно положить лавровый лист."},{"s":"Накрой крышкой и туши на слабом огне, пока картофель не станет мягким.","t":30},{"s":"Посыпь зеленью и подавай."}]},{"id":"m10","name":"Куриные котлеты с гречкой","cat":"main","time":40,"ing":{"chicken_mince":150,"onion":30,"bread":15,"buckwheat":60,"oil":7,"cucumber":100},"how":"Фарш смешать с тёртым луком и размоченным хлебом, сформировать котлеты, обжарить и довести под крышкой 10 мин. Гарнир — гречка, огурец.","need":["pan","pot_any|multi"],"steps":[{"s":"Поставь гречку: промой, залей водой 1:2, посоли, после закипания вари на минимуме под крышкой.","t":15},{"s":"Размочи хлеб в воде или молоке на 3 минуты и отожми. Лук натри на мелкой тёрке."},{"s":"Смешай фарш, хлеб и лук, посоли, поперчи и хорошо вымеси 2 минуты — так котлеты будут сочнее."},{"s":"Мокрыми руками сформируй котлеты толщиной 1,5–2 см."},{"s":"Обжарь на масле на среднем огне с одной стороны.","t":4},{"s":"Переверни, подлей 2–3 ложки воды, накрой крышкой и доведи на слабом огне.","t":8},{"s":"Подавай с гречкой и огурцом."}]},{"id":"m11","name":"Ленивые голубцы","cat":"main","time":50,"ing":{"beef_mince":120,"rice":40,"cabbage":150,"carrot":40,"onion":30,"tomato_paste":15,"sour_cream":20},"how":"Фарш смешать с рисом и мелко нарезанной капустой, сформировать шарики. Тушить 35 мин в соусе из пасты, сметаны, лука и моркови.","need":["pan|kazan|multi"],"steps":[{"s":"Отвари рис до полуготовности.","t":8},{"s":"Капусту нашинкуй очень мелко, лук — мелко, морковь натри."},{"s":"Смешай фарш, рис, капусту и половину лука, посоли, поперчи. Сформируй шарики-котлеты."},{"s":"Обжарь их на сковороде с двух сторон.","t":5},{"s":"Для соуса: оставшийся лук и морковь обжарь, добавь томатную пасту, сметану и воду (около 150 мл на порцию), посоли.","t":5},{"s":"Залей голубцы соусом, накрой крышкой и туши на слабом огне.","t":35}]},{"id":"m12","name":"Овощное рагу с курицей","cat":"main","time":40,"ing":{"chicken_breast":130,"zucchini":150,"potato":120,"bell_pepper":70,"carrot":50,"onion":30,"tomato":100,"oil":7},"how":"Обжарить курицу, добавить овощи кубиками, тушить 25 мин под крышкой.","need":["pan|kazan|multi"],"steps":[{"   const ing = Object.entries(r.ing).map(([pid, a]) => `<div class="li"><span>${P[pid].name}</span><span>${amtStr(pid, a * m * ppl)}</span></div>`).join("");
  const md = document.createElement("div"); md.className = "modal";
  md.innerHTML = `<div class="sheet"><div class="tag">${r.time ? r.time + " мин" : "без готовки"} · ${ppl > 1 ? ppl + " порц." : "1 порция"}</div><h2 style="margin-top:4px">${r.name}</h2><div class="mut">${fmt(k[0])} ккал · Б ${fmt(k[1])} · Ж ${fmt(k[2])} · У ${fmt(k[3])} на порцию</div>${r.need && r.need.length ? `<div class="mut" style="margin-top:6px">Посуда: ${needStr(r)}${A.weight && !canCook(r) ? ` <span class="est">— у тебя нет</span>` : ""}</div>` : ""}<div style="margin-top:8px">${ing}</div><p>${r.how}</p><p class="mut">≈ ${fmt(recipeCost(r, m * ppl))} ₸</p><button class="btn full" style="margin-top:12px" data-act="cook" data-id="${id}" data-m="${m}" data-ppl="${ppl}">Рецепт готовки — пошагово</button><div class="row">${slot ? `<button class="btn sec" data-swap="${slot}">Заменить блюдо</button>` : ""}<button class="btn sec" data-act="close">Закрыть</button></div></div>`;
  md.onclick = e => { if (e.target === md) closeModal(); };
  document.body.appendChild(md);
  try { tg && tg.BackButton.show(); } catch (e) {}
}
function openCook(id, m, ppl) {
  closeModal();
  const r = R[id], tot = (r.steps || []).reduce((t, s) => t + (s.t || 0), 0);
  const ing = Object.entries(r.ing).map(([pid, a]) => `<div class="li"><span>${P[pid].name}</span><span>${amtStr(pid, a * m * ppl)}</span></div>`).join("");
  const steps = (r.steps || []).map((s, i) => `<div class="step"><div class="n" data-n="${i + 1}">${i + 1}</div><div class="tx">${esc(s.s)}${s.t ? `<br><button class="timer" data-timer="${s.t * 60}">⏱ Таймер ${s.t} мин</button>` : ""}</div></div>`).join("");
  const md = document.createElement("div"); md.className = "modal";
  md.innerHTML = `<div class="sheet" style="max-height:94vh"><div class="tag">${ppl > 1 ? ppl + " порц." : "1 порция"}${tot ? " · время по шагам ≈ " + tot + " мин" : ""}</div><h2 style="margin-top:4px">${r.name}</h2>${r.need && r.need.length ? `<div class="mut">Посуда: ${needStr(r)}</div>` : ""}<div class="grp">Понадобится</div>${ing}<div class="mut" style="margin-top:6px">+ соль, перец и специи по вкусу</div><div class="grp">Как готовить</div>${steps}<p class="mut">Нажми на номер шага, чтобы отметить его выполненным.</p><div class="row"><button class="btn sec" data-act="close">Закрыть</button></div></div>`;
  md.onclick = e => { if (e.target === md) closeModal(); };
  document.body.appendChild(md);
  try { tg && tg.BackButton.show(); } catch (e) {}
}
const TIMERS = new Map();
function startTimer(btn, sec) {
  if (TIMERS.has(btn)) { clearInterval(TIMERS.get(btn)); TIMERS.delete(btn); btn.className = "timer"; btn.textContent = "⏱ Таймер " + Math.round(sec / 60) + " мин"; return; }
  const end = Date.now() + sec * 1000; btn.className = "timer run";
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    btn.textContent = "⏸ " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    if (!left) {
      clearInterval(TIMERS.get(btn)); TIMERS.delete(btn); btn.className = "timer end"; btn.textContent = "✓ Время вышло";
      toast("⏱ Время вышло — переходи к следующему шагу");
      try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
    }
  };
  tick(); TIMERS.set(btn, setInterval(tick, 1000));
}
function closeModal() { TIMERS.forEach(t => clearInterval(t)); TIMERS.clear(); document.querySelectorAll(".modal").forEach(m => m.remove()); try { tg && quizStep <= 0 && tg.BackButton.hide(); } catch (e) {} }

// ---------- действия ----------
function listText() {
  const L = shopping(PLAN);
  return "🛒 Список покупок на неделю\n" + L.items.map(it => `• ${P[it.pid].name} — ${amtStr(it.pid, it.amt)}`).join("\n") + `\n\n≈ ${fmt(L.totals.mix)} ₸`;
}
function copyText(t) {
  const ok = () => toast("Список скопирован");
  const fb = () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (e) { toast("Не удалось скопировать"); } a.remove(); };
  try { navigator.clipboard ? navigator.clipboard.writeText(t).then(ok, fb) : fb(); } catch (e) { fb(); }
}
function share() {
  const t = listText(), url = D.botLink || "https://t.me";
  if (tg) { try { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(t)); return; } catch (e) {} }
  copyText(t);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act],[data-day],[data-open],[data-done],[data-rf],[data-swap],[data-n],[data-timer]");
  if (!a) return;
  const d = a.dataset;
  if (d.act === "quiz") startQuiz();
  else if (d.act === "qnext") qNext();
  else if (d.act === "qback") { quizStep = Math.max(0, stepFrom(quizStep, -1)); render(); }
  else if (d.act === "qcancel") { quizStep = -1; render(); }
  else if (d.act === "rebuild") build((PLAN ? PLAN.seed : 0) + 1);
  else if (d.act === "copy") copyText(listText());
  else if (d.act === "share") share();
  else if (d.act === "close") closeModal();
  else if (d.act === "ban") openBanEditor("ban");
  else if (d.act === "fav") openBanEditor("fav");
  else if (d.act === "cook") openCook(d.id, +d.m, +d.ppl);
  else if (d.n) { a.closest(".step").classList.toggle("ok"); haptic(); }
  else if (d.timer) startTimer(a, +d.timer);
  else if (d.act === "bansave") saveBan();
  else if (d.day) { curDay = +d.day; haptic(); render(); }
  else if (d.open) openRecipe(d.open, +d.m, d.slot);
  else if (d.done) { DONE[d.done] = !DONE[d.done]; ST.set("done", DONE); haptic(); render(); }
  else if (d.rf) { recFilter = d.rf; render(); }
  else if (d.swap) { const s = d.swap; closeModal(); swapMeal(curDay, s); }
});

fetch("prices.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(j => { if (j && j.stores) { PRICES = j; render(); } }).catch(() => {});
ST.pull(["answers", "plan", "done"], () => {
  A = ST.get("answers") || A; PLAN = ST.get("plan") || PLAN; DONE = ST.get("done") || DONE;
  if (!A.excl) A.excl = [];
  if (!A.slots) A.slots = A.meals === "4" ? ["b","l","d","s"] : ["b","l","d"];
  if (!A.tools) A.tools = ["pan","pot_small","pot_big","oven"];
  if (PLAN && !PLAN.days[0][PLAN.slots[0]].hasOwnProperty("m")) PLAN = null;
  render();
});
render();
}
</script>
</body>
