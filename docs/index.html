<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Еда на неделю</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">
<style>
/* Еда на неделю — дизайн-система
   ИДЕЯ: неделя как мозаика тарелок. Цвет = приём пищи (завтрак — абрикос, обед — томат, ужин — баклажан, перекус — яблоко).
   ШРИФТЫ: Unbounded — заголовки и цифры, Onest — текст. ФОН: шалфей, акцент — зелень. */
:root{
 --bg:#EEF1EB;--card:#FFFFFF;--soft:#F5F7F3;--ink:#17201A;--mut:#68725F;--line:#E0E5DC;
 --acc:#14724A;--acc-ink:#FFFFFF;--acc2:#DCEEE2;--warn:#C2551F;--warn2:#FBE6DA;
 --b:#E99A1F;--b2:#FDEFD2;--l:#DD4B32;--l2:#FBE2DB;--d:#6A4C9E;--d2:#ECE5F6;--s:#5E9F2E;--s2:#E5F1D8;
 --sh:0 1px 2px rgba(23,32,26,.05),0 6px 20px -8px rgba(23,32,26,.12);
 --disp:"Unbounded",system-ui,sans-serif;--txt:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 --navh:68px;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--txt);overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 170px}
h1,h2,.disp{font-family:var(--disp);font-weight:600;letter-spacing:-.02em}
h1{font-size:26px;line-height:1.12;margin:4px 0 6px}
h2{font-size:18px;line-height:1.2;margin:0 0 12px}
h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
p{margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.sub{color:var(--mut);font-size:15px;margin:0 0 16px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.full{width:100%}.btn.sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:13px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
/* ---------- квиз ---------- */
.qtop{display:flex;align-items:center;gap:12px;margin:2px 0 26px}
.qtop .n{font-family:var(--disp);font-size:13px;font-weight:500;color:var(--mut);white-space:nowrap}
.prog{flex:1;display:flex;gap:3px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .25s}.prog i.on{background:var(--acc)}
.quiz h2{font-size:24px;line-height:1.15;margin:0 0 8px}
.quiz .note{color:var(--mut);font-size:15px;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--sh),inset 0 0 0 1.5px transparent;cursor:pointer;min-height:60px;transition:box-shadow .15s,background .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt .t{flex:1}.opt .t b{display:block;font-weight:600;font-size:16px}.opt .t small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.opt .ind{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt.multi .ind{border-radius:8px}
.opt .ind svg{width:14px;height:14px;fill:none;stroke:var(--acc-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.opt.on{background:var(--acc2);box-shadow:inset 0 0 0 2px var(--acc)}
.opt.on .ind{background:var(--acc);box-shadow:none}.opt.on .ind svg{opacity:1}
.opt .em{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seg .opt{justify-content:center;font-family:var(--disp);font-size:22px;font-weight:600;min-height:72px;padding:0}
.field{display:flex;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--sh),inset 0 0 0 1.5px var(--line);padding:0 18px;margin:0 0 4px;transition:box-shadow .15s}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
.field input{flex:1;border:0;background:none;outline:0;font:600 24px/1 var(--disp);color:var(--ink);padding:18px 0;letter-spacing:-.02em;width:100%}
.field input::placeholder{color:var(--line)}
.field span{color:var(--mut);font-size:16px;margin-left:8px}
label.f{display:block;margin:16px 0 8px;font-size:15px;font-weight:500}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--sh);margin:4px 0 12px}
.search svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--ink);padding:14px 0}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:10px -16px;padding:0 16px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh);font-size:15px;cursor:pointer;transition:background .15s,color .15s}
.chip.on,.chip.fav{background:var(--acc);color:var(--acc-ink);font-weight:600}
.chip.ban{background:var(--warn2);color:var(--warn);text-decoration:line-through;box-shadow:none}
.chip .dot{width:8px;height:8px;border-radius:50%}
.grp{margin:20px 0 8px;font-size:14px;font-weight:600;color:var(--mut)}
.grp:first-child{margin-top:4px}
/* ---------- старт ---------- */
.hero{padding:10px 0 4px}
.hero h1{font-size:38px;line-height:1.02;margin:6px 0 12px;letter-spacing:-.035em}
.hero p{font-size:17px;color:var(--mut);margin:0 0 22px;max-width:30ch}
.mosaic{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 22px}
.mosaic .col{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.mosaic .col>small{text-align:center;font-size:12px;color:var(--mut);font-weight:500}
.mosaic i{display:block;height:30px;border-radius:9px;transform-origin:bottom}
.mosaic.anim i{animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ib{background:var(--b)}.il{background:var(--l)}.id{background:var(--d)}.is{background:var(--s)}
.feats{display:grid;gap:2px;background:var(--card);border-radius:22px;padding:6px 16px;box-shadow:var(--sh);margin:0 0 18px}
.leg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:-12px 0 22px}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;background:var(--c)}
.feats div{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.feats div:first-child{border-top:0}
.feats b{font-weight:600}
.feats .em{flex:none;font-size:22px;width:28px;text-align:center}
/* ---------- рацион ---------- */
.wk{background:var(--card);border-radius:24px;padding:18px 16px 14px;box-shadow:var(--sh);margin:0 0 14px}
.wk .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wk .sum{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.wk .sum small{font-size:16px;color:var(--mut);font-weight:500;letter-spacing:0}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.meter.over i{background:var(--warn)}
.wk .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.wk .meta b{color:var(--acc);font-weight:600}.wk .meta b.o{color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 0}
.week button{display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:6px 4px 7px;border:0;border-radius:14px;background:none;cursor:pointer;transition:background .15s}
.week button>b{font-size:13px;font-weight:600;text-align:center;color:var(--mut)}
.week button>small{font-size:11px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
.week button i{display:block;height:9px;border-radius:4px;opacity:.85}
.week button.on{background:var(--soft)}
.week button.on>b{color:var(--ink)}
.week button.today>b::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:2px auto 0}
.dayh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.dayh h2{margin:0;font-size:22px}
.dayh span{font-family:var(--disp);font-size:15px;font-weight:500;color:var(--mut);white-space:nowrap}
.macro{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:0 2px 6px}
.macro i:nth-child(1){background:var(--d)}.macro i:nth-child(2){background:var(--b)}.macro i:nth-child(3){background:var(--s)}
.mleg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin:0 2px 14px;flex-wrap:wrap}
.mleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.mleg span:nth-child(1)::before{background:var(--d)}.mleg span:nth-child(2)::before{background:var(--b)}.mleg span:nth-child(3)::before{background:var(--s)}
.meals{display:grid;gap:10px}
.meal{position:relative;display:block;width:100%;text-align:left;border:0;padding:15px 16px 14px;border-radius:22px;cursor:pointer;background:var(--card);box-shadow:var(--sh);overflow:hidden;transition:transform .12s}
.meal:active{transform:scale(.985)}
.meal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.meal .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.slot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--c);background:var(--c2);padding:4px 10px 4px 8px;border-radius:999px}
.slot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.meal .g{font-size:13px;color:var(--mut);white-space:nowrap}
.meal h3{margin:0 0 8px;font-size:18px}
.meal .nums{display:flex;gap:14px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meal .nums b{color:var(--ink);font-weight:600}
.meal .go{position:absolute;right:14px;bottom:14px;width:22px;height:22px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.sb{--c:var(--b);--c2:var(--b2)}.sl{--c:var(--l);--c2:var(--l2)}.sd{--c:var(--d);--c2:var(--d2)}.ss{--c:var(--s);--c2:var(--s2)}
.save{display:flex;gap:14px;align-items:center;background:var(--acc2);border-radius:22px;padding:16px;margin:14px 0}
.save .big{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--acc);letter-spacing:-.02em;white-space:nowrap}
.save p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.alert{background:var(--warn2);border-radius:22px;padding:16px;margin:0 0 14px}
.alert h3{color:var(--warn);margin-bottom:4px}
.alert .mut{margin-bottom:12px}
.alert .btns{display:flex;gap:8px}.alert .btns .btn{flex:1}
.hint{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--mut);margin:14px 0}
/* ---------- списки ---------- */
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0}.li>span:last-child{white-space:nowrap;text-align:right}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.chk:first-child{border-top:0}
.chk .box{flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk .box svg{width:14px;height:14px;fill:none;stroke:var(--acc-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk .t{flex:1}.chk .t b{display:block;font-weight:500;font-size:16px}.chk .t small{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.chk .p{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}.chk .p small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.chk.done .box{background:var(--acc);box-shadow:none}.chk.done .box svg{opacity:1}
.chk.done .t b{text-decoration:line-through;color:var(--mut)}.chk.done .t,.chk.done .p{opacity:.55}
.prg{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.prg .meter{flex:1;margin:0}
.prg span{font-family:var(--disp);font-size:14px;font-weight:500;white-space:nowrap}
.cardh{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.cardh .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--c2,var(--soft))}
.cardh b{font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 0 0;margin-top:4px;border-top:1px solid var(--line)}
.total .disp{font-size:24px;white-space:nowrap}
.stores{display:grid;gap:12px;margin:10px 0 2px}
.store{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:15px}
.store .bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.store .bar i{display:block;height:100%;background:var(--mut);opacity:.45;border-radius:5px}
.store.best .bar i{background:var(--acc);opacity:1}
.store.best b,.store.best span:last-child{color:var(--acc);font-weight:600}
.est{color:var(--warn);font-size:12px;font-weight:500}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,62px);gap:4px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.prow>span:not(:first-child){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.h{font-size:12px;color:var(--mut);border-top:0;padding-top:2px;font-weight:500}
.prow .b{color:var(--acc);font-weight:700}
.rec{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.rec:first-child{border-top:0}
.rec .sq{flex:none;width:50px;height:50px;border-radius:15px;background:var(--c2);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rec .sq b{font-family:var(--disp);font-size:17px;font-weight:600}.rec .sq small{font-size:10px;margin-top:2px;font-weight:600}
.rec .t{flex:1}.rec .t b{display:block;font-weight:600;font-size:16px;line-height:1.25}.rec .t small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.rec .p{font-size:14px;color:var(--mut);white-space:nowrap;text-align:right}
/* ---------- профиль ---------- */
.me{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.ava{flex:none;width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font:600 24px var(--disp);display:flex;align-items:center;justify-content:center}
.me h1{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{background:var(--card);border-radius:18px;padding:14px 10px;box-shadow:var(--sh)}
.stats b{display:block;font:600 clamp(15px,4.4vw,19px)/1.1 var(--disp);letter-spacing:-.02em;white-space:nowrap}
.stats span{font-size:12px;color:var(--mut)}
.set{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;font-size:15px}
.set:first-child{border-top:0}
.set .k{flex:none;color:var(--mut);width:42%}.set .v{flex:1;text-align:right;font-weight:500}
.set .ch{flex:none;width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set.act2 .k{color:var(--ink);font-weight:500;width:auto;flex:1}.set.act2 .v{flex:none;color:var(--mut);font-weight:400}
/* ---------- навигация ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:var(--mut);font-size:11px;font-weight:500;padding:2px 0;cursor:pointer;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .pill{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc);font-weight:600}.nav button.on .pill{background:var(--acc2)}
.act{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));padding:12px 16px 10px;pointer-events:none;z-index:9;background:linear-gradient(transparent,var(--bg) 40%)}
.act .in{max-width:528px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}.act .btn{flex:1}
.act .btn.sec{flex:.75}
.quiz .act{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
/* ---------- шторка ---------- */
.modal{position:fixed;inset:0;background:rgba(10,14,11,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:23px;margin:10px 0 6px}
.sheet .row{display:flex;gap:10px;margin-top:12px}.sheet .row .btn{flex:1}
.sheet .foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:16px -16px calc(-18px - env(safe-area-inset-bottom));padding:12px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}
.sheet .foot .row{margin-top:10px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.nutri{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;margin:14px 0}
.nutri div{background:var(--card);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.nutri b{display:block;font:600 17px/1.15 var(--disp);letter-spacing:-.02em}.nutri span{font-size:12px;color:var(--mut)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mut);background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:var(--sh)}
.badge.w{color:var(--warn);background:var(--warn2);box-shadow:none}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:36px;height:36px;border-radius:12px;background:var(--acc2);color:var(--acc);font:600 15px var(--disp);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;transition:all .15s}
.step .n svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.step.ok .n{background:var(--acc);color:var(--acc-ink)}.step.ok .tx{opacity:.45}
.step .tx{padding-top:6px;font-size:16px;line-height:1.5}
.timer{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:9px 14px;border-radius:12px;border:0;background:var(--acc2);color:var(--acc);font-size:15px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:30;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .25s cubic-bezier(.2,.9,.3,1)}

.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty .em{font-size:40px;display:block;margin-bottom:8px}
.fade{animation:fade .25s}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.sm{width:15px;height:15px;stroke-width:2.2}
.chip .ic.sm{margin-right:-1px}.ic.fav{color:var(--l);fill:var(--l);margin-right:4px;vertical-align:-2px}
.opt .em{color:var(--acc)}.opt.on .em{background:var(--card)}

.feats .em{width:40px;height:40px;border-radius:13px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.illo{display:flex;justify-content:center;margin:0 0 4px}.illo svg{width:100%;max-width:300px;height:auto}
.illo.sm{margin:4px 0 8px}.illo.sm svg{max-width:130px}
.illo.anim svg>*{animation:pop .55s cubic-bezier(.3,1.4,.6,1) both}
.illo.anim svg>*:nth-child(2){animation-delay:.05s}.illo.anim svg>*:nth-child(3){animation-delay:.1s}.illo.anim svg>*:nth-child(4){animation-delay:.15s}.illo.anim svg>*:nth-child(5){animation-delay:.2s}.illo.anim svg>*:nth-child(n+6){animation-delay:.25s}
.illo.anim svg>*{transform-box:fill-box;transform-origin:50% 100%}
.alert.info{background:var(--b2)}.alert.info h3{color:#9A5B00}
.card.list{padding:2px 16px}
.set .si{flex:none;width:34px;height:34px;border-radius:11px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.set .si .ic{width:19px;height:19px}
.set .k{flex:none;width:auto;color:var(--ink);font-weight:500}
.set .v{flex:1;text-align:right;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn .ic{width:20px;height:20px;stroke-width:2}
.badge .ic.sm{width:14px;height:14px}
.timer .ic.sm{width:16px;height:16px}

/* ---------- покупки: купить / дома ---------- */
.segc{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E2E7DE;border-radius:15px;padding:4px;margin:4px 0 16px}
.segc button{border:0;background:none;border-radius:11px;padding:10px 6px;font-size:15px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .15s,color .15s}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.segc span{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--acc2);color:var(--acc);font-size:13px;margin-left:4px}
div.chk{cursor:default}
.chk>.box{border:0;background:none;padding:0;cursor:pointer}
.chk>.t{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chk.done>.box{background:var(--acc)}
.set .t2{flex:1;min-width:0}.set .t2 b{display:block;font-weight:500}.set .t2 small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.field input::placeholder{font:500 17px var(--txt);color:#B5BDB0;letter-spacing:0}
.nw .si,.cardh .si{flex:none;width:34px;height:34px;border-radius:11px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.nw p{margin:8px 0 12px}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

"},{"s":"Залей гречку водой в соотношении 1:2, посоли, доведи до кипения на сильном огне."},{"s":"Убавь огонь до минимума, накрой крышкой и вари, не открывая, пока вода не впитается.","t":15},{"s":"Добавь масло, перемешай, дай постоять под крышкой 5 минут.","t":5},{"s":"Подогрей молоко (не кипяти) и залей гречку в тарелке."}]},{"id":"b7","name":"Бутерброды с сыром и варёным яйцом","cat":"breakfast","time":12,"ing":{"bread":70,"cheese":30,"eggs":1,"tomato":80,"butter":5},"how":"Сварить яйцо 9 мин. Хлеб с маслом, сыром, помидором и яйцом.","need":["pot_any"],"steps":[{"s":"Положи яйцо в кастрюлю, залей холодной водой, доведи до кипения."},{"s":"После закипания вари на среднем огне.","t":9},{"s":"Переложи яйцо в холодную воду на 3 минуты — так оно легко почистится.","t":3},{"s":"Хлеб намажь маслом, сверху сыр, кружки помидора и яйца. Посоли и поперчи."}]},{"id":"b8","name":"Рисовая каша на молоке","cat":"breakfast","time":25,"ing":{"rice":60,"milk":250,"butter":5,"honey":10},"how":"Рис отварить в воде 7 мин, слить, добавить молоко и варить ещё 12–15 мин. Масло и мёд по вкусу.","need":["pot_any|multi"],"steps":[{"s":"Промой рис до прозрачной воды."},{"s":"Залей рис водой (в 2 раза больше по объёму), доведи до кипения и вари на среднем огне.","t":7},{"s":"Слей лишнюю воду, влей молоко, добавь щепотку соли."},{"s":"Вари на слабом огне, помешивая каждые 2–3 минуты, чтобы не пригорело.","t":15},{"s":"Добавь масло, накрой крышкой и дай постоять.","t":5},{"s":"В тарелке полей мёдом."}]},{"id":"b9","name":"Шакшука","cat":"breakfast","time":20,"ing":{"eggs":2,"tomato":200,"bell_pepper":80,"onion":40,"oil":7,"bread":50},"how":"Обжарить лук и перец, добавить нарезанные помидоры, тушить 7 мин. Сделать лунки, вбить яйца, накрыть на 5 мин. Подавать с хлебом.","need":["pan"],"steps":[{"s":"Нарежь лук полукольцами, перец — соломкой, помидоры — кубиками."},{"s":"Разогрей масло на сковороде на среднем огне, обжарь лук до мягкости.","t":3},{"s":"Добавь перец, жарь ещё немного.","t":3},{"s":"Добавь помидоры, соль, перец, при желании зиру или паприку. Туши, пока соус не загустеет.","t":7},{"s":"Сделай ложкой 2 углубления, разбей в них яйца, посоли желтки."},{"s":"Убавь огонь до слабого, накрой крышкой и готовь, пока белок не схватится, а желток останется жидким.","t":5},{"s":"Подавай прямо на сковороде с хлебом."}]},{"id":"b10","name":"Ленивая овсянка с йогуртом и яблоком","cat":"breakfast","time":5,"ing":{"yogurt":150,"oats":40,"apple":100,"honey":10},"how":"С вечера смешать хлопья с йогуртом, убрать в холодильник. Утром добавить яблоко и мёд.","need":[],"steps":[{"s":"Вечером смешай в банке или контейнере хлопья с йогуртом."},{"s":"Закрой крышкой и убери в холодильник минимум на 6 часов или на ночь."},{"s":"Утром нарежь яблоко кубиками, добавь сверху и полей мёдом. Можно есть холодной."}]},{"id":"s1","name":"Куриный суп с лапшой","cat":"soup","time":50,"ing":{"chicken_thigh":120,"pasta":30,"potato":100,"carrot":40,"onion":30,"greens":5},"how":"Варить бедро 30 мин, достать и разобрать мясо. В бульон картофель, морковь и лук на 10 мин, затем лапшу на 5 мин. Вернуть мясо, добавить зелень.","need":["bigpot"],"steps":[{"s":"Положи куриное бедро в кастрюлю, залей холодной водой (около 500 мл на порцию), доведи до кипения."},{"s":"Сними пену шумовкой, посоли, убавь огонь до слабого и вари под приоткрытой крышкой.","t":30},{"s":"Пока варится, очисти и нарежь картофель кубиками, морковь — кружками или на тёрке, лук — мелко."},{"s":"Достань курицу, отдели мясо от костей и нарежь."},{"s":"В кипящий бульон положи картофель, морковь и лук, вари.","t":10},{"s":"Всыпь лапшу (макароны), помешай, вари до готовности.","t":5},{"s":"Верни мясо, попробуй на соль, добавь рубленую зелень и выключи огонь. Дай постоять 5 минут под крышкой.","t":5}]},{"id":"s2","name":"Борщ","cat":"soup","time":75,"ing":{"beef":100,"beet":80,"cabbage":100,"potato":100,"carrot":30,"onion":30,"tomato_paste":15,"sour_cream":20,"oil":5},"how":"Варить говядину 50 мин. Свёклу, морковь и лук потушить с томатной пастой. В бульон картофель и капусту на 10 мин, затем зажарку на 10 мин. Подавать со сметаной.","need":["bigpot","pan"],"steps":[{"s":"Залей говядину холодной водой (около 600 мл на порцию), доведи до кипения, сними пену."},{"s":"Убавь огонь до слабого, посоли и вари мясо.","t":50},{"s":"Пока варится: свёклу и морковь натри на крупной тёрке, лук нарежь мелко, капусту нашинкуй тонко, картофель нарежь кубиками."},{"s":"На сковороде с маслом обжарь лук и морковь на среднем огне.","t":4},{"s":"Добавь свёклу, томатную пасту и 2–3 ложки бульона. Туши под крышкой. Для яркого цвета можно добавить каплю уксуса или лимонного сока.","t":10},{"s":"Достань мясо, нарежь кусочками. В бульон положи картофель и капусту.","t":10},{"s":"Добавь зажарку и мясо, вари на слабом огне. Посоли, поперчи, можно лавровый лист.","t":10},{"s":"Выключи огонь и дай борщу настояться под крышкой. Подавай со сметаной.","t":15}]},{"id":"s3","name":"Суп с куриными фрикадельками","cat":"soup","time":40,"ing":{"chicken_mince":120,"potato":120,"carrot":40,"onion":30,"rice":15,"greens":5},"how":"Скатать фрикадельки из фарша. В кипящую воду картофель, морковь, лук и рис на 10 мин, затем фрикадельки на 10 мин. Зелень в конце.","need":["bigpot"],"steps":[{"s":"Мелко нарежь или натри треть лука и смешай с фаршем, посоли и поперчи."},{"s":"Мокрыми руками скатай фрикадельки размером с грецкий орех."},{"s":"Вскипяти воду (около 500 мл на порцию), посоли. Положи картофель кубиками, морковь, оставшийся лук и промытый рис.","t":10},{"s":"По одной опусти фрикадельки в кипящий суп, они всплывут через 2–3 минуты. Вари.","t":10},{"s":"Добавь зелень, попробуй на соль и выключи огонь."}]},{"id":"s4","name":"Чечевичный суп","cat":"soup","time":35,"ing":{"lentils":70,"potato":80,"carrot":40,"onion":40,"tomato_paste":10,"oil":7},"how":"Обжарить лук и морковь с пастой. Чечевицу и картофель варить 20 мин, добавить зажарку, при желании пробить блендером.","need":["bigpot","pan"],"steps":[{"s":"Промой чечевицу. Картофель нарежь кубиками, лук — мелко, морковь натри."},{"s":"Вскипяти воду (около 450 мл на порцию), положи чечевицу и картофель, вари на среднем огне.","t":15},{"s":"На сковороде с маслом обжарь лук и морковь, добавь томатную пасту и зиру (по желанию).","t":5},{"s":"Добавь зажарку в суп, посоли, вари ещё немного, пока чечевица не разварится.","t":7},{"s":"По желанию пробей блендером до крем-супа. Подавай с долькой лимона и хлебом."}]},{"id":"s5","name":"Щи из свежей капусты","cat":"soup","time":55,"ing":{"beef":90,"cabbage":150,"potato":100,"carrot":30,"onion":30,"tomato_paste":10,"sour_cream":20},"how":"Варить говядину 35 мин, добавить капусту и картофель на 15 мин, затем зажарку из лука, моркови и пасты на 5 мин.","need":["bigpot","pan"],"steps":[{"s":"Залей говядину холодной водой (около 600 мл на порцию), доведи до кипения, сними пену."},{"s":"Посоли, убавь огонь и вари.","t":35},{"s":"Нашинкуй капусту, картофель нарежь кубиками, лук мелко, морковь натри."},{"s":"Достань мясо и нарежь. В бульон положи капусту и картофель.","t":15},{"s":"На сковороде обжарь лук и морковь, добавь томатную пасту, прогрей 2 минуты.","t":5},{"s":"Добавь зажарку и мясо в суп, вари. Посоли, поперчи, положи лавровый лист.","t":5},{"s":"Дай настояться под крышкой. Подавай со сметаной и зеленью.","t":10}]},{"id":"s6","name":"Сорпа (шорпа) с говядиной","cat":"soup","time":90,"ing":{"beef":130,"potato":150,"carrot":50,"onion":50,"bell_pepper":50,"greens":5},"how":"Говядину крупными кусками варить 60 мин на слабом огне, снимая пену. Добавить крупно нарезанные овощи на 20 мин. Зелень при подаче.","need":["bigpot"],"steps":[{"s":"Нарежь говядину крупными кусками по 4–5 см, залей холодной водой (около 700 мл на порцию)."},{"s":"Доведи до кипения на сильном огне и тщательно сними всю пену — от этого зависит прозрачность бульона."},{"s":"Убавь огонь до минимального, чтобы бульон еле булькал, посоли и вари.","t":60},{"s":"Нарежь крупно: картофель — половинками, морковь — крупными брусками, лук — целиком или четвертинками, перец — на 4 части."},{"s":"Положи овощи в бульон, вари на слабом огне, пока картофель не станет мягким.","t":20},{"s":"Добавь чёрный перец, зелень, выключи огонь и дай постоять 10 минут. Подавай мясо и овощи в тарелке, бульон — отдельно в пиале.","t":10}]},{"id":"m1","name":"Гречка с куриным филе и овощами","cat":"main","time":30,"ing":{"buckwheat":70,"chicken_breast":150,"carrot":50,"onion":40,"oil":7},"how":"Сварить гречку. Филе кубиками обжарить с луком и морковью 10 мин, смешать с гречкой.","need":["pot_any|multi","pan"],"steps":[{"s":"Промой гречку, залей водой 1:2, посоли и поставь вариться: после закипания — минимальный огонь под крышкой.","t":15},{"s":"Пока варится, нарежь куриное филе кубиками 2 см, лук — полукольцами, морковь — соломкой."},{"s":"Разогрей масло на сковороде на среднем-сильном огне, обжарь курицу до белого цвета со всех сторон.","t":5},{"s":"Добавь лук и морковь, посоли, поперчи, жарь, помешивая, пока овощи не станут мягкими.","t":6},{"s":"Добавь готовую гречку в сковороду, перемешай и прогрей вместе.","t":2}]},{"id":"m2","name":"Курица с рисом и овощами","cat":"main","time":35,"ing":{"rice":70,"chicken_breast":150,"bell_pepper":80,"zucchini":100,"oil":7},"how":"Сварить рис. Курицу и овощи обжарить, потушить 10 мин под крышкой.","need":["pot_any|multi","pan"],"steps":[{"s":"Промой рис, залей водой 1:2, посоли, после закипания вари на минимальном огне под крышкой.","t":15},{"s":"Нарежь курицу кубиками, кабачок — полукружьями, перец — соломкой."},{"s":"Обжарь курицу на масле на среднем-сильном огне до румяности.","t":5},{"s":"Добавь овощи, соль, перец, можно соевый соус. Влей 50 мл воды, накрой крышкой и туши.","t":10},{"s":"Выложи рис на тарелку, сверху — курицу с овощами."}]},{"id":"m3","name":"Плов с говядиной (лёгкий)","cat":"main","time":80,"ing":{"rice":80,"beef":120,"carrot":120,"onion":50,"garlic":5,"oil":15},"how":"В казане обжарить мясо, лук и морковь соломкой, залить водой и тушить 30 мин (зирвак). Всыпать промытый рис, воды на 1,5 см выше, сверху головка чеснока. Варить до впитывания, затем 20 мин под крышкой на минимуме.","need":["kazan|multi|pot_big"],"steps":[{"s":"Промой рис 5–6 раз до прозрачной воды и замочи в тёплой подсоленной воде на 30 минут.","t":30},{"s":"Нарежь мясо кубиками 2–3 см, лук — полукольцами, морковь — длинной соломкой (не на тёрке!)."},{"s":"Сильно разогрей масло в казане. Обжарь мясо до корочки, не мешая первые 2 минуты.","t":7},{"s":"Добавь лук, жарь до золотистого цвета.","t":4},{"s":"Добавь морковь, не мешай 2 минуты, затем перемешай и жарь до мягкости. Посоли, добавь зиру и барбарис (по желанию).","t":5},{"s":"Влей кипяток так, чтобы покрыть содержимое, убавь огонь и туши — это зирвак.","t":30},{"s":"Слей воду с риса, выложи его ровным слоем поверх зирвака, не перемешивая. Аккуратно влей кипяток, чтобы он покрыл рис на 1,5 см. Вдави в центр головку чеснока."},{"s":"На сильном огне выпари воду с поверхности риса. Потом собери рис горкой, сделай палочкой несколько проколов до дна."},{"s":"Накрой плотной крышкой, убавь огонь до минимума и томи.","t":20},{"s":"Перемешай плов снизу вверх и подавай."}]},{"id":"m4","name":"Лагман домашний","cat":"main","time":50,"ing":{"pasta":80,"beef":110,"bell_pepper":70,"tomato":100,"onion":40,"carrot":40,"cabbage":50,"garlic":5,"oil":10},"how":"Мясо соломкой обжарить, добавить овощи, тушить с водой 20 мин (ваджу). Отварить спагетти, полить соусом.","need":["pot_any","pan|kazan"],"steps":[{"s":"Нарежь мясо тонкой соломкой, перец, морковь и капусту — соломкой, лук — полукольцами, помидоры — кубиками, чеснок — мелко."},{"s":"В сковороде или казане сильно разогрей масло, обжарь мясо до румяности.","t":5},{"s":"Добавь лук и морковь, жарь.","t":3},{"s":"Добавь перец, капусту, чеснок, затем помидоры. Посоли, добавь зиру и молотый перец.","t":3},{"s":"Влей воду (около 150 мл на порцию), накрой крышкой и туши на среднем огне — это ваджу (подлива).","t":20},{"s":"Тем временем отвари спагетти в подсоленной воде по инструкции на пачке, откинь и сбрызни маслом.","t":9},{"s":"Разложи лапшу по глубоким тарелкам и щедро полей ваджу."}]},{"id":"m5","name":"Тефтели в томатном соусе с пюре","cat":"main","time":50,"ing":{"beef_mince":150,"rice":20,"onion":30,"tomato_paste":20,"potato":200,"milk":50,"butter":5},"how":"Фарш смешать с отварным рисом и луком, скатать тефтели, тушить 25 мин в соусе из пасты и воды. Картофель отварить и размять с молоком и маслом.","need":["pot_any","pan|kazan|multi"],"steps":[{"s":"Отвари рис для тефтелей до полуготовности, остуди.","t":8},{"s":"Мелко нарежь половину лука, смешай с фаршем и рисом, посоли, поперчи и хорошо вымеси."},{"s":"Скатай тефтели размером с мандарин."},{"s":"Обжарь тефтели на сковороде со всех сторон до корочки.","t":5},{"s":"Добавь оставшийся лук, томатную пасту и воду (около 150 мл на порцию), посоли. Накрой крышкой и туши на слабом огне.","t":25},{"s":"Параллельно очисти картофель, нарежь крупно, отвари в подсоленной воде до мягкости.","t":20},{"s":"Слей воду, добавь масло и горячее молоко, разомни толкушкой до гладкого пюре."},{"s":"Подавай пюре с тефтелями и соусом."}]},{"id":"m6","name":"Минтай, запечённый с картофелем","cat":"main","time":45,"ing":{"fish_pollock":200,"potato":200,"onion":30,"sour_cream":30,"oil":5},"how":"Картофель тонкими кружками в форму, сверху рыбу и лук, смазать сметаной. Запекать 35 мин при 190°.","need":["oven"],"steps":[{"s":"Разогрей духовку до 190°."},{"s":"Если минтай замороженный — разморозь в холодильнике или холодной воде. Обсуши, удали плавники, нарежь порционно."},{"s":"Картофель очисти и нарежь тонкими кружками 3–4 мм, лук — полукольцами."},{"s":"Смажь форму маслом, выложи картофель, посоли и поперчи."},{"s":"Сверху выложи рыбу, посоли, затем лук. Смажь всё сметаной."},{"s":"Накрой фольгой и запекай.","t":25},{"s":"Сними фольгу и запекай до румяной корочки.","t":10}]},{"id":"m7","name":"Паста с курицей и шампиньонами","cat":"main","time":30,"ing":{"pasta":80,"chicken_breast":120,"mushrooms":100,   h += `<div class="stats"><div><b>${fmt(target())}</b><span>норма, ккал</span></div><div><b>${PLAN ? fmt(avgKc(PLAN)) : "—"}</b><span>в меню, ккал</span></div><div><b>${PLAN ? fmt(shopping(PLAN).totals.mix) + " ₸" : "—"}</b><span>из ${fmt(A.budget)} ₸</span></div></div>`;
  h += `<div class="grp">Мои данные</div><div class="card list">
    ${row(A.goal === "lose" ? "down" : A.goal === "gain" ? "up" : "keep", "Цель", qv("goal"), 'data-edit="goal"')}
    ${row(A.sex === "f" ? "female" : "male", "Пол", qv("sex"), 'data-edit="sex"')}
    ${row("cake", "Возраст", A.age + " " + plural(A.age, "год", "года", "лет"), 'data-edit="body" data-only="age"')}
    ${row("ruler", "Рост", A.height + " см", 'data-edit="body" data-only="height"')}
    ${row("scales", "Вес", A.weight + " кг", 'data-edit="body" data-only="weight"')}
    ${row("b" + (["1.2","1.375","1.55","1.725"].indexOf(A.act) + 1), "Активность", qv("act"), 'data-edit="act"')}</div>`;
  h += `<div class="grp">Продукты</div><div class="card list">
    ${row("heart", "Любимые", (A.fav || []).length ? (A.fav || []).length + " " + plural(A.fav.length, "продукт", "продукта", "продуктов") : "не выбраны", 'data-act="fav"')}
    ${row("ban", "Нежелательные", (A.ban || []).length ? A.ban.length + " " + plural(A.ban.length, "продукт", "продукта", "продуктов") : "нет", 'data-act="ban"')}
    ${row("wheat", "Не ем", ml("excl", qm("excl")), 'data-edit="excl"')}
    ${row("box", "Есть дома", Object.keys(STOCK).length ? Object.keys(STOCK).length + " " + plural(Object.keys(STOCK).length, "продукт", "продукта", "продуктов") : "пусто", 'data-act="home"')}</div>`;
  const qs = k => Q.find(x => x.k === k);
  h += `<div class="grp">Меню</div><div class="card list">
    ${row("sun", "Приёмы пищи", ml("slots", qm("slots")), 'data-edit="slots"')}
    ${qs("full").skip(A) ? "" : row("target", "Вся еда за день", A.full === "1" ? "да" : "нет", 'data-edit="full"')}
    ${qs("batch").skip(A) ? "" : row("box", "Обед с ужина", isBatch() ? "да" : "нет", 'data-edit="batch"')}
    ${row("clock", "Время на готовку", +A.time > 100 ? "не важно" : "до " + A.time + " мин", 'data-edit="time"')}
    ${row("pot_small", "Посуда", ml("tools", qm("tools")), 'data-edit="tools"')}
    ${row("people", "Готовлю на", A.people + " " + plural(+A.people, "человека", "человек", "человек"), 'data-edit="people"')}
    ${row("wallet", "Бюджет", fmt(A.budget) + " ₸ в неделю", 'data-edit="budget"')}</div>`;
  h += `<button class="btn full ghost" data-act="quiz" style="margin-top:18px">Пройти опрос заново</button>`;
  el.innerHTML = h + about();
}
const about = () => `<div class="grp">О приложении</div><div class="card"><p class="mut" style="margin:0">Бесплатный помощник: меню на неделю, КБЖУ, список покупок и сравнение цен в Алматы. Калории считаем по формуле Миффлина — Сан-Жеора. Цены обновляются раз в день и могут отличаться от цены на полке. Это не медицинская рекомендация.</p></div>`;

// ---------- рецепт ----------
function openRecipe(id, m, slot) {
  const r = R[id], ppl = PLAN && slot ? PLAN.ppl : 1, k = RN[id].map(v => v * m);
  const ing = Object.entries(r.ing).map(([pid, a]) => `<div class="li"><span>${P[pid].name}</span><span class="mut">${amtStr(pid, a * m * ppl)}</span></div>`).join("");
  const sc = slot ? SC[slot] : CATC[r.cat], noTool = A.weight && !canCook(r);
  const md = document.createElement("div"); md.className = "modal";
  md.innerHTML = `<div class="sheet ${sc}" role="dialog" aria-label="${esc(r.name)}"><div class="grab"></div><span class="slot">${slot ? SLOT[slot] : CAT[r.cat]}</span><h2>${r.name}</h2><div class="badges"><span class="badge">${icon("clock", "sm")}${r.time ? r.time + " мин" : "без готовки"}</span><span class="badge">${ppl > 1 ? ppl + " порции" : "1 порция"}</span><span class="badge">≈ ${fmt(recipeCost(r, m * ppl))} ₸</span>${r.need && r.need.length ? `<span class="badge ${noTool ? "w" : ""}">${needStr(r)}${noTool ? " — нет" : ""}</span>` : ""}</div>
  <div class="nutri"><div><b>${fmt(k[0])}</b><span>ккал</span></div><div><b>${fmt(k[1])}</b><span>белки</span></div><div><b>${fmt(k[2])}</b><span>жиры</span></div><div><b>${fmt(k[3])}</b><span>углев.</span></div></div>
  <div class="card" style="padding:6px 16px"><div class="grp" style="margin:10px 0 2px">Продукты</div>${ing}</div><p class="mut" style="font-size:15px">${r.how}</p>
  <div class="foot"><button class="btn full" data-act="cook" data-id="${id}" data-m="${m}" data-ppl="${ppl}">${icon("steps")}Готовить по шагам</button><div class="row">${slot ? `<button class="btn sec" data-swap="${slot}">Заменить блюдо</button>` : ""}<button class="btn sec" data-act="close">Закрыть</button></div></div></div>`;
  md.onclick = e => { if (e.target === md) closeModal(); };
  document.body.appendChild(md);
  try { tg && tg.BackButton.show(); } catch (e) {}
}
function openCook(id, m, ppl) {
  closeModal();
  const r = R[id], tot = (r.steps || []).reduce((t, s) => t + (s.t || 0), 0);
  const ing = Object.entries(r.ing).map(([pid, a]) => `<div class="li"><span>${P[pid].name}</span><span class="mut">${amtStr(pid, a * m * ppl)}</span></div>`).join("");
  const steps = (r.steps || []).map((s, i) => `<div class="step"><button class="n" data-n="${i + 1}" aria-label="Шаг ${i + 1} выполнен">${i + 1}</button><div class="tx">${esc(s.s)}${s.t ? `<br><button class="timer" data-timer="${s.t * 60}">${icon("clock", "sm")}Таймер ${s.t} мин</button>` : ""}</div></div>`).join("");
  const md = document.createElement("div"); md.className = "modal";
  md.innerHTML = `<div class="sheet ${CATC[r.cat]}" style="max-height:95vh" role="dialog" aria-label="${esc(r.name)}"><div class="grab"></div><span class="slot">По шагам</span><h2>${r.name}</h2><div class="badges"><span class="badge">${ppl > 1 ? ppl + " порции" : "1 порция"}</span>${tot ? `<span class="badge">${icon("clock", "sm")}≈ ${tot} мин</span>` : ""}${r.need && r.need.length ? `<span class="badge">${needStr(r)}</span>` : ""}</div>
  <div class="card" style="padding:6px 16px;margin-top:16px"><div class="grp" style="margin:10px 0 2px">Понадобится</div>${ing}<div class="li mut"><span>Соль, перец, специи</span><span>по вкусу</span></div></div>
  <div class="card" style="padding:4px 16px">${steps}</div><p class="mut" style="text-align:center">Нажми на номер шага, чтобы отметить его</p><div class="foot"><button class="btn full sec" data-act="close">Закрыть</button></div></div>`;
  md.onclick = e => { if (e.target === md) closeModal(); };
  document.body.appendChild(md);
  try { tg && tg.BackButton.show(); } catch (e) {}
}
const TIMERS = new Map();
function startTimer(btn, sec) {
  if (TIMERS.has(btn)) { clearInterval(TIMERS.get(btn)); TIMERS.delete(btn); btn.className = "timer"; btn.innerHTML = icon("clock", "sm") + "Таймер " + Math.round(sec / 60) + " мин"; return; }
  const end = Date.now() + sec * 1000; btn.className = "timer run";
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    btn.textContent = "Пауза · " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    if (!left) {
      clearInterval(TIMERS.get(btn)); TIMERS.delete(btn); btn.className = "timer end"; btn.textContent = "Время вышло";
      toast("Время вышло — переходи к следующему шагу");
      try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
    }
  };
  tick(); TIMERS.set(btn, setInterval(tick, 1000));
}
function closeModal() { TIMERS.forEach(t => clearInterval(t)); TIMERS.clear(); document.querySelectorAll(".modal").forEach(m => m.remove()); try { tg && quizStep <= 0 && tg.BackButton.hide(); } catch (e) {} }

// ---------- действия ----------
function listText() {
  const L = shopping(PLAN);
  return "Список покупок на неделю\n" + L.items.filter(it => !it.home).map(it => `• ${P[it.pid].name} — ${it.pk ? it.pk.label : amtStr(it.pid, it.amt)}`).join("\n") + `\n\n≈ ${fmt(L.totals.receipt)} ₸`;
}
function copyText(t) {
  const ok = () => toast("Список скопирован");
  const fb = () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (e) { toast("Не удалось скопировать"); } a.remove(); };
  try { navigator.clipboard ? navigator.clipboard.writeText(t).then(ok, fb) : fb(); } catch (e) { fb(); }
}
function share() {
  const t = listText(), url = D.botLink || "https://t.me";
  if (tg) { try { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(t)); return; } catch (e) {} }
  copyText(t);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-tip],[data-lv],[data-stock],[data-edit],[data-act],[data-day],[data-open],[data-done],[data-rf],[data-swap],[data-n],[data-timer]");
  if (!a) return;
  const d = a.dataset;
  if (d.act === "quiz") startQuiz();
  else if (d.act === "qnext") qNext();
  else if (d.act === "qback") { quizStep = Math.max(0, stepFrom(quizStep, -1)); render(); }
  else if (d.act === "qcancel") { quizStep = -1; render(); }
  else if (d.act === "rebuild") build((PLAN ? PLAN.seed : 0) + 1, {msg: "Готово — новое меню"});
  else if (d.act === "budget") { A.budget = +d.v; A.budgetPpl = +A.people; ST.set("answers", A); build((PLAN ? PLAN.seed : 0) + 1, {msg: "Бюджет — " + fmt(+d.v) + " ₸, меню собрано"}); }
  else if (d.edit) openEdit(d.edit, d.only);
  else if (d.lv) { listView = d.lv; haptic(); render(); }
  else if (d.tip === "time") { A.time = d.v; ST.set("answers", A); build(PLAN.seed + 1, {msg: "Время на готовку изменено, меню обновлено"}); }
  else if (d.stock) openStock(d.stock, +d.need || 0);
  else if (d.act === "stockadd") openStockAdd();
  else if (d.act === "newweek") askNewWeek();
  else if (d.act === "home") { listView = "home"; go("list"); }
  else if (d.act === "copy") copyText(listText());
  else if (d.act === "share") share();
  else if (d.act === "close") closeModal();
  else if (d.act === "ban") openBanEditor("ban");
  else if (d.act === "fav") openBanEditor("fav");
  else if (d.act === "cook") openCook(d.id, +d.m, +d.ppl);
  else if (d.n) { const st = a.closest(".step"); st.classList.toggle("ok"); a.innerHTML = st.classList.contains("ok") ? ICO.check : d.n; haptic(); }
  else if (d.timer) startTimer(a, +d.timer);
  else if (d.act === "bansave") saveBan();
  else if (d.day) { curDay = +d.day; haptic(); render(); }
  else if (d.open) openRecipe(d.open, +d.m, d.slot);
  else if (d.done) { DONE[d.done] = !DONE[d.done]; ST.set("done", DONE); haptic(); render(); }
  else if (d.rf) { recFilter = d.rf; render(); }
  else if (d.swap) { const s = d.swap; closeModal(); swapMeal(curDay, s); }
});

setStores();
const loadPrices = u => fetch(u, {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(j => j && j.stores && Object.values(j.stores).some(x => Object.keys(x.items || {}).length) ? j : null);
(D.pricesUrl ? loadPrices(D.pricesUrl).catch(() => null) : Promise.resolve(null)).then(j => j || loadPrices("prices.json").catch(() => null)).then(j => { if (j) { PRICES = j; setStores(); if (quizStep < 0 && !document.querySelector(".modal")) render(); } });
ST.pull(["answers", "plan", "done", "stock"], () => {
  A = ST.get("answers") || A; PLAN = ST.get("plan") || PLAN; DONE = ST.get("done") || DONE; STOCK = ST.get("stock") || STOCK;
  if (!A.excl) A.excl = [];
  if (!A.slots) A.slots = A.meals === "4" ? ["b","l","d","s"] : ["b","l","d"];
  if (!A.tools) A.tools = ["pan","pot_small","pot_big","oven"];
  if (PLAN && !PLAN.days[0][PLAN.slots[0]].hasOwnProperty("m")) PLAN = null;
  render();
});
render();
}
</script>
</body>
